<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Iranian Dates</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="slider-main">
    <!-- Backgrounds -->
    <div class="backgrounds">
        <div class="background"
             style="background: radial-gradient(
                 50% 50% at 50% 50%,
                 #C98B45 0%,
                 #5E2E16 100%
             );">
        </div>
        <div class="background"
             style="background: radial-gradient(
                 50% 50% at 50% 50%,
                 #9C5B35 0%,
                 #35150C 100%
             );">
        </div>
    </div>
    <!-- Content -->
    <div class="container">
        <div class="logo">
            <a href="#">
                <h1>DATE<span>LAND</span></h1>
            </a>
        </div>
        <div class="slider-content-wrap">
            <div class="slider-content">
                <span class="product-label">
                    PREMIUM IRANIAN DATES
                </span>
                <h2 class="heading-style-2">
                    Zahedi Dates
                </h2>
                <p>
                    Premium quality Iranian Zahedi dates,
                    naturally sweet with a firm texture.
                    Perfect for export and international markets.
                </p>
                <h3 class="heading-style-2">
                    Premium Quality
                </h3>
                <div class="product-info">
                    <span>Iran</span>
                    <span>Export Quality</span>
                </div>
            </div>
        </div>
    </div>
    <!-- Date Images -->
    <div class="slider-images">
        <img
            class="slider-image"
            src="images/Zahedi20v2.jpg"
            alt="Iranian Zahedi Dates">
        <img
            class="slider-image"
            src="images/Sayer-Dates-2.jpg"
            alt="Iranian Sayer Dates">
        <img
            class="slider-image"
            src="images/Kabkab20v2.jpg"
            alt="Iranian Kabkab Dates">
            
        <img
            class="slider-image"
            src="images/Mazafati.jpg"
            alt="Iranian Mazafati Dates">
    </div>
    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
        <span>SCROLL</span>
        <div class="mouse">
            <div class="wheel"></div>
        </div>
    </div>
</section>
<script src="main.js"></script>
</body>
</html>
